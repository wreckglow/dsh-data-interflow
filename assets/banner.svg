<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-labelledby="ifx-banner-title ifx-banner-desc">
  <title id="ifx-banner-title">DSH Interflow</title>
  <desc id="ifx-banner-desc">A mesh between DSH instances on a phone, a watch, and a server, with HTTP or MQTT transport and encrypted messages.</desc>
  <defs>
    <linearGradient id="ifx-banner-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="0.55" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#0e1630"/>
    </linearGradient>
    <radialGradient id="ifx-banner-glow-a" cx="0.18" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#4a6dff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#4a6dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ifx-banner-glow-b" cx="0.86" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#25d3c0" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#25d3c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ifx-banner-text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="0.55" stop-color="#b9c8ff"/>
      <stop offset="1" stop-color="#7de8dc"/>
    </linearGradient>
    <linearGradient id="ifx-banner-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#26d0c9"/>
    </linearGradient>
    <pattern id="ifx-banner-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1a2742" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#ifx-banner-bg)"/>
  <rect width="1280" height="360" fill="url(#ifx-banner-grid)" opacity="0.42"/>
  <rect width="1280" height="360" fill="url(#ifx-banner-glow-a)"/>
  <rect width="1280" height="360" fill="url(#ifx-banner-glow-b)"/>

  <text x="72" y="86" fill="#8ea0c8" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12.5" letter-spacing="3.2">DSH PLUGIN · MULTI-INSTANCE MESH</text>
  <text x="68" y="158" fill="url(#ifx-banner-text)" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="62" font-weight="700" letter-spacing="-2">DSH INTERFLOW</text>
  <text x="72" y="204" fill="#d6def5" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="25" font-weight="600">多个 DSH 实例，异步互通</text>
  <text x="72" y="236" fill="#8594b8" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="14.5">One mesh for your DSH instances. No public IP required. Store, forward, execute, reply.</text>

  <g font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12">
    <rect x="72" y="270" width="132" height="28" rx="14" fill="#101a31" stroke="#26385c"/>
    <text x="138" y="289" fill="#9fb2dc" text-anchor="middle">HTTP hub / spoke</text>
    <rect x="216" y="270" width="104" height="28" rx="14" fill="#101a31" stroke="#26385c"/>
    <text x="268" y="289" fill="#9fb2dc" text-anchor="middle">MQTT relay</text>
    <rect x="332" y="270" width="118" height="28" rx="14" fill="#101a31" stroke="#26385c"/>
    <text x="391" y="289" fill="#9fb2dc" text-anchor="middle">E2E encrypted</text>
    <rect x="462" y="270" width="142" height="28" rx="14" fill="#101a31" stroke="#26385c"/>
    <text x="533" y="289" fill="#9fb2dc" text-anchor="middle">remote execution</text>
  </g>

  <g>
    <circle cx="1008" cy="180" r="146" fill="#5b8cff" opacity="0.08"/>
    <circle cx="1008" cy="180" r="104" fill="none" stroke="#223458" stroke-width="1.2" stroke-dasharray="4 10"/>
    <circle cx="1008" cy="180" r="62" fill="none" stroke="#2a3d66" stroke-width="1.2"/>

    <path d="M1008 180 L1008 84" stroke="#33507f" stroke-width="1.6" stroke-dasharray="5 7"/>
    <path d="M1008 180 L906 284" stroke="#33507f" stroke-width="1.6" stroke-dasharray="5 7"/>
    <path d="M1008 180 L1112 284" stroke="#33507f" stroke-width="1.6" stroke-dasharray="5 7"/>

    <rect x="944" y="146" width="128" height="68" rx="16" fill="#101a31" stroke="#4b6dff" stroke-width="1.6"/>
    <text x="1008" y="176" fill="#e8eeff" text-anchor="middle" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="2">MESH</text>
    <text x="1008" y="194" fill="#8ea0c8" text-anchor="middle" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5">store &amp; forward</text>

    <rect x="956" y="52" width="104" height="40" rx="10" fill="#0c1425" stroke="#2b3f68"/>
    <text x="1008" y="77" fill="#c8d6f5" text-anchor="middle" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12">DSH A</text>

    <rect x="846" y="278" width="104" height="40" rx="10" fill="#0c1425" stroke="#2b3f68"/>
    <text x="898" y="303" fill="#c8d6f5" text-anchor="middle" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12">DSH B</text>

    <rect x="1062" y="278" width="104" height="40" rx="10" fill="#0c1425" stroke="#2b3f68"/>
    <text x="1114" y="303" fill="#c8d6f5" text-anchor="middle" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="12">DSH C</text>

    <circle cx="956" cy="72" r="4" fill="#2fd8a8"/>
    <circle cx="846" cy="298" r="4" fill="#2fd8a8"/>
    <circle cx="1062" cy="298" r="4" fill="#f2b84b"/>
  </g>

  <rect x="72" y="330" width="1136" height="1" fill="#1d2a45"/>
  <text x="1208" y="342" fill="#5f6f92" text-anchor="end" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="10.5">DSH · Interflow 1.0</text>
</svg>
