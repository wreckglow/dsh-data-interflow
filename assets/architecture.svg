<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" role="img" aria-labelledby="ifx-arch-title ifx-arch-desc">
  <title id="ifx-arch-title">Three ways to connect DSH instances</title>
  <desc id="ifx-arch-desc">Peer mode on one LAN, a server mailbox with outbound spokes, or an MQTT relay for devices on different networks without a public IP.</desc>
  <defs>
    <linearGradient id="ifx-arch-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <pattern id="ifx-arch-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17233c" stroke-width="1"/>
    </pattern>
    <marker id="ifx-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5b7cc9"/>
    </marker>
    <marker id="ifx-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2fd8c0"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="url(#ifx-arch-bg)"/>
  <rect width="1280" height="760" fill="url(#ifx-arch-grid)" opacity="0.4"/>

  <text x="48" y="58" fill="#eef3ff" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="1">THREE WAYS TO CONNECT</text>
  <text x="48" y="84" fill="#8594b8" font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif" font-size="13">Pick the transport that matches where the devices are. The message model is the same in all three.</text>

  <g font-family="ui-sans-serif, 'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif">
    <!-- Panel A: peer -->
    <rect x="40" y="112" width="380" height="474" rx="18" fill="#0b1222" stroke="#1d2b47"/>
    <text x="66" y="148" fill="#dfe8fb" font-size="15" font-weight="700">01 · Peer</text>
    <text x="66" y="170" fill="#7f8fb3" font-size="11.5">Same LAN or same machine. Symmetric.</text>

    <rect x="66" y="206" width="148" height="70" rx="12" fill="#0f1a30" stroke="#2b3f68"/>
    <text x="140" y="236" fill="#d7e2f8" text-anchor="middle" font-size="12">DSH · A</text>
    <text x="140" y="254" fill="#8092b8" text-anchor="middle" font-size="10.5">listens :47810</text>

    <rect x="246" y="206" width="148" height="70" rx="12" fill="#0f1a30" stroke="#2b3f68"/>
    <text x="320" y="236" fill="#d7e2f8" text-anchor="middle" font-size="12">DSH · B</text>
    <text x="320" y="254" fill="#8092b8" text-anchor="middle" font-size="10.5">listens :47811</text>

    <line x1="216" y1="241" x2="242" y2="241" stroke="#5b7cc9" stroke-width="1.6" marker-end="url(#ifx-arrow)"/>
    <line x1="242" y1="249" x2="216" y2="249" stroke="#5b7cc9" stroke-width="1.6" marker-end="url(#ifx-arrow)"/>
    <text x="229" y="290" fill="#7f8fb3" text-anchor="middle" font-size="10">/log + /ingest</text>

    <text x="66" y="338" fill="#9fb2dc" font-size="11.5">1. copy the other address into Peers</text>
    <text x="66" y="360" fill="#9fb2dc" font-size="11.5">2. each side pulls GET /log?since=…</text>
    <text x="66" y="382" fill="#9fb2dc" font-size="11.5">3. relay: true forwards across the mesh</text>
    <text x="66" y="430" fill="#2fd8a8" font-size="11.5">No central node · lowest latency</text>
    <text x="66" y="500" fill="#6f7f9f" font-size="10.5">Good for: home lab, one LAN, a single machine.</text>

    <!-- Panel B: mailbox -->
    <rect x="450" y="112" width="380" height="474" rx="18" fill="#0b1222" stroke="#1d2b47"/>
    <text x="476" y="148" fill="#dfe8fb" font-size="15" font-weight="700">02 · Mailbox (hub / spoke)</text>
    <text x="476" y="170" fill="#7f8fb3" font-size="11.5">One always-on node stores; the others only dial out.</text>

    <rect x="580" y="206" width="120" height="66" rx="12" fill="#121d38" stroke="#4b6dff"/>
    <text x="640" y="234" fill="#e6edff" text-anchor="middle" font-size="12" font-weight="600">hub · mailbox</text>
    <text x="640" y="252" fill="#8ea0c8" text-anchor="middle" font-size="10">durable inbox</text>

    <rect x="482" y="330" width="112" height="58" rx="12" fill="#0f1a30" stroke="#2b3f68"/>
    <text x="538" y="355" fill="#d7e2f8" text-anchor="middle" font-size="12">spoke A</text>
    <text x="538" y="372" fill="#8092b8" text-anchor="middle" font-size="10">no listener</text>

    <rect x="686" y="330" width="112" height="58" rx="12" fill="#0f1a30" stroke="#2b3f68"/>
    <text x="742" y="355" fill="#d7e2f8" text-anchor="middle" font-size="12">spoke B</text>
    <text x="742" y="372" fill="#8092b8" text-anchor="middle" font-size="10">no listener</text>

    <line x1="538" y1="328" x2="600" y2="276" stroke="#2fd8c0" stroke-width="1.6" stroke-dasharray="5 6" marker-end="url(#ifx-arrow-teal)"/>
    <line x1="742" y1="328" x2="682" y2="276" stroke="#2fd8c0" stroke-width="1.6" stroke-dasharray="5 6" marker-end="url(#ifx-arrow-teal)"/>
    <text x="520" y="300" fill="#7f8fb3" font-size="10">outbound</text>
    <text x="696" y="300" fill="#7f8fb3" font-size="10">outbound</text>

    <text x="476" y="420" fill="#9fb2dc" font-size="11.5">1. spokes poll GET /inbox and POST /ingest</text>
    <text x="476" y="442" fill="#9fb2dc" font-size="11.5">2. offline messages wait in the mailbox</text>
    <text x="476" y="464" fill="#9fb2dc" font-size="11.5">3. push backlog retries after reconnect</text>
    <text x="476" y="512" fill="#2fd8a8" font-size="11.5">Devices never need to be online together</text>
    <text x="476" y="556" fill="#6f7f9f" font-size="10.5">Good for: one always-on node; other instances dial out.</text>

    <!-- Panel C: MQTT -->
    <rect x="860" y="112" width="380" height="474" rx="18" fill="#0b1222" stroke="#1d2b47"/>
    <text x="886" y="148" fill="#dfe8fb" font-size="15" font-weight="700">03 · MQTT relay</text>
    <text x="886" y="170" fill="#7f8fb3" font-size="11.5">No public IP anywhere. Every instance dials out.</text>

    <rect x="980" y="206" width="140" height="66" rx="16" fill="#121d38" stroke="#7c5cff"/>
    <text x="1050" y="234" fill="#e6edff" text-anchor="middle" font-size="12" font-weight="600">MQTT broker</text>
    <text x="1050" y="252" fill="#8ea0c8" text-anchor="middle" font-size="10">free public or self-hosted</text>

    <rect x="884" y="330" width="98" height="58" rx="12" fill="#0f1a30" stroke="#2b3f68"/>
    <text x="933" y="355" fill="#d7e2f8" text-anchor="middle" font-size="11.5">instance A</text>
    <text x="933" y="371" fill="#8092b8" text-anchor="middle" font-size="9.5">publisher</text>

    <rect x="1001" y="330" width="98" height="58" rx="12" fill="#0f1a30" stroke="#2b3f68"/>
    <text x="1050" y="355" fill="#d7e2f8" text-anchor="middle" font-size="11.5">instance B</text>
    <text x="1050" y="371" fill="#8092b8" text-anchor="middle" font-size="9.5">publisher</text>

    <rect x="1118" y="330" width="98" height="58" rx="12" fill="#0f1a30" stroke="#2b3f68"/>
    <text x="1167" y="355" fill="#d7e2f8" text-anchor="middle" font-size="11.5">instance C</text>
    <text x="1167" y="371" fill="#8092b8" text-anchor="middle" font-size="9.5">publisher</text>

    <line x1="933" y1="328" x2="1008" y2="276" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#ifx-arrow)"/>
    <line x1="1050" y1="328" x2="1050" y2="276" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#ifx-arrow)"/>
    <line x1="1167" y1="328" x2="1092" y2="276" stroke="#7c5cff" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#ifx-arrow)"/>
    <text x="1050" y="304" fill="#7f8fb3" text-anchor="middle" font-size="10">wss · QoS 1</text>

    <text x="886" y="420" fill="#9fb2dc" font-size="11.5">1. same room + same secret on every device</text>
    <text x="886" y="442" fill="#9fb2dc" font-size="11.5">2. presence topic discovers devices</text>
    <text x="886" y="464" fill="#9fb2dc" font-size="11.5">3. AES-256-GCM payloads; broker sees ciphertext</text>
    <text x="886" y="512" fill="#2fd8a8" font-size="11.5">Works from three different networks</text>
    <text x="886" y="556" fill="#6f7f9f" font-size="10.5">Good for: instances on different networks with no public IP.</text>

    <!-- footer -->
    <rect x="40" y="618" width="1200" height="1" fill="#1d2a45"/>
    <text x="48" y="650" fill="#9fb2dc" font-size="12">All transports: durable local log · dedupe by event id · shared-token auth · store-and-forward</text>
    <text x="48" y="674" fill="#7f8fb3" font-size="11.5">MQTT adds AES-256-GCM payload encryption. HTTP modes rely on Tailscale/TLS for transport privacy.</text>
    <text x="48" y="710" fill="#5f6f92" font-size="10.5">DSH Interflow · README architecture diagram</text>
  </g>
</svg>
